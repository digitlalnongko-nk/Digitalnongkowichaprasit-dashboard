<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <meta property="og:title" content="ระบบคลังรูปภาพกิจกรรม รร.หนองโกวิชาประสิทธิ์พิทยาคม">
    <meta property="og:description" content="ประมวลภาพกิจกรรมและผลงานต่างๆ ของโรงเรียน">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1XvvNNsIH3ir3ITQLc5oEqMA9xYptQMwV">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1XvvNNsIH3ir3ITQLc5oEqMA9xYptQMwV" type="image/x-icon">

    <title>คลังรูปภาพกิจกรรม - ศูนย์ดิจิทัลชุมชน</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { 
            --accent: #059669; 
            --accent-hover: #047857; 
            --accent-light: #ecfdf5; 
            --bg: #f8fafc; 
            --bg-card: #ffffff; 
            --text-main: #1e293b; 
            --text-sub: #64748b; 
            --border-color: #e2e8f0; 
            --icon-dark: #475569; 
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            overflow-x: hidden; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        h1, h2, h3, h4, h5, h6 { font-family: 'Kanit', sans-serif; text-decoration: none !important; color: var(--text-main); }
        p { text-decoration: none !important; color: var(--text-sub); }

        .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 20px 4vw; box-sizing: border-box; }
        @media (max-width: 768px) { .container { padding: 15px 4vw; } }

        /* =======================================================
           1. หน้าแรกรวมอัลบั้ม (เก็บสไตล์ให้สวยเข้ากับหน้าหลัก)
           ======================================================= */
        .home-hero { 
            position: relative; height: 35vh; min-height: 250px; max-height: 400px; 
            border-radius: 24px; margin-bottom: 40px; background-size: cover; 
            background-position: center; display: flex; align-items: flex-end; 
            overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
        }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(4, 120, 87, 0.9), rgba(0,0,0,0.2)); z-index: 1; }
        .hero-content { position: relative; z-index: 2; padding: 40px 4vw; color: white; width: 100%; box-sizing: border-box; }
        .hero-content h2 { margin: 0; font-size: clamp(26px, 4vw, 42px); font-weight: 700; color: white;}

        #album-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        @media (max-width: 640px) { #album-list { grid-template-columns: 1fr; } } 
        
        .album-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.3s ease; }
        .album-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .album-card img { width: 100%; height: 220px; object-fit: cover; transition: 0.5s; }
        .album-card:hover img { transform: scale(1.03); }

        .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .search-container { position: relative; max-width: 400px; width: 100%; }
        .search-input { width: 100%; padding: 12px 20px 12px 45px; border-radius: 50px; border: 1px solid var(--border-color); outline: none; font-family: 'Prompt', sans-serif; font-size: 14px; box-sizing: border-box; color: var(--text-main); transition: 0.3s;}
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        .nav-bar { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 20px; font-weight: 500; color: var(--text-sub); font-size: 14px; transition: 0.3s; }
        .nav-bar:hover { color: var(--accent); }

        /* =======================================================
           2. หน้าข้างในอัลบั้ม (สไตล์ PIXIESET)
           ======================================================= */
        
        /* หน้าปกใหญ่เต็มจอ กว้างสุดขอบ */
        .pixieset-hero {
            position: relative;
            width: 100vw;
            height: 70vh; /* สูง 70% ของจอ */
            min-height: 400px;
            margin-left: calc(-50vw + 50%); /* เทคนิคดันให้ทะลุ padding ของ container */
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: -20px; /* ชดเชยระยะขอบบน */
            margin-bottom: 40px;
        }
        .pixieset-overlay {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.45); /* สีดำโปร่งแสงบังรูป ให้ตัวหนังสือเด่น */
            z-index: 1;
        }
        .pixieset-content {
            position: relative;
            z-index: 2;
            color: white;
            padding: 0 20px;
            max-width: 900px;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .pixieset-content h1 {
            font-size: clamp(32px, 5vw, 64px);
            font-weight: 500; /* ฟอนต์บางลง ดูแพงขึ้น */
            margin: 0 0 15px 0;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        .pixieset-content p.date {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
            margin: 0 0 20px 0;
        }
        .pixieset-content p.desc {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ปุ่มย้อนกลับแบบลอยอยู่บนรูปปก */
        .btn-back-float {
            position: absolute;
            top: 25px;
            left: 4vw;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            transition: 0.3s;
        }
        .btn-back-float:hover { background: white; color: var(--text-main); }

        /* แถบเครื่องมือดาวน์โหลด (ชิดขวาแบบคลีนๆ) */
        .pixieset-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        .pixieset-toolbar .action-btn {
            display: flex; align-items: center; gap: 6px;
            background: transparent; border: none;
            color: var(--text-sub); font-size: 14px; font-weight: 400;
            cursor: pointer; transition: 0.3s; padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        .pixieset-toolbar .action-btn:hover { color: var(--accent); }

        /* 🔥 รูปแบบ Masonry Grid (เรียงแบบต่อบล็อก ไม่ตัดรูป) */
        .masonry-grid {
            column-count: 4; /* คอมพิวเตอร์โชว์ 4 คอลัมน์ */
            column-gap: 15px; /* ระยะห่างช่องว่าง */
            padding-bottom: 40px;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 15px;
            position: relative;
            border-radius: 4px; /* Pixieset ขอบมักจะคม หรือมนนิดเดียว */
            overflow: hidden;
            cursor: pointer;
            background: #f1f5f9;
        }
        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease, filter 0.3s ease;
        }
        .masonry-item:hover img { transform: scale(1.02); filter: brightness(0.9); }
        
        .img-action-container { position: absolute; bottom: 12px; right: 12px; display: flex; gap: 8px; opacity: 0; transition: 0.3s; transform: translateY(8px); }
        .masonry-item:hover .img-action-container { opacity: 1; transform: translateY(0); }
        .mini-btn { background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); color: var(--text-main); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .mini-btn:hover { background: var(--accent); color: white; transform: scale(1.1); }

        @media (max-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 768px) {
            .masonry-grid { column-count: 2; column-gap: 8px; }
            .masonry-item { margin-bottom: 8px; border-radius: 2px; }
            .pixieset-hero { height: 50vh; min-height: 350px; }
            .pixieset-content h1 { font-size: 28px; }
            .btn-back-float { top: 15px; left: 15px; font-size: 12px; padding: 6px 12px; }
            .pixieset-toolbar { justify-content: center; }
        }
        @media (max-width: 480px) {
            /* มือถือจอเล็กมาก ปรับเป็น 1 หรือ 2 คอลัมน์ (เลือก 2 เพื่อความสวยงาม) */
            .masonry-grid { column-count: 2; column-gap: 6px; }
            .masonry-item { margin-bottom: 6px; }
        }

        /* =======================================================
           3. Modal / Lightbox / Skeletons
           ======================================================= */
        .modal { display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .confirm-popup { background: white; padding: 35px 30px; border-radius: 20px; width: 90%; max-width: 360px; position: relative; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        
        .close-mini { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #94a3b8; font-size: 28px !important; transition: 0.3s; z-index: 10600; }
        .close-mini:hover { color: #ef4444; }
        
        #imageModal { background: rgba(15, 23, 42, 0.98); } /* Lightbox สีเข้ม */
        #imageModal .close-mini { color: white; top: 25px; right: 25px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 10px; cursor: pointer; z-index: 10010; color: white; transition: 0.3s; opacity: 0.7; }
        .nav-btn:hover { opacity: 1; transform: translateY(-50%) scale(1.2); }
        .nav-btn span { font-size: 40px; }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        .btn-minimal { margin-top: 20px; background: var(--text-main); color: white; padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; font-family: 'Kanit'; font-weight: 500; font-size: 15px; transition: 0.3s; }
        .btn-minimal:hover { background: black; }

        #toast { visibility: hidden; min-width: 250px; background: var(--text-main); color: #fff; text-align: center; border-radius: 50px; padding: 12px 24px; position: fixed; z-index: 10000; left: 50%; bottom: 40px; transform: translateX(-50%); opacity: 0; transition: 0.4s; font-size: 14px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        #backToTopBtn {
            position: fixed; bottom: 30px; right: 30px; z-index: 9900; background: var(--text-main); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; box-shadow: 0 10px 15px rgba(0,0,0,0.1); transition: 0.4s; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transform: translateY(20px);
        }
        #backToTopBtn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #backToTopBtn:hover { background: black; transform: translateY(-5px); }

        .skeleton { background: #e2e8f0; background: linear-gradient(110deg, #e2e8f0 8%, #f8fafc 18%, #e2e8f0 33%); background-size: 200% 100%; animation: 1.5s shine linear infinite; border-radius: 4px; width: 100%; }
        @keyframes shine { to { background-position-x: -200%; } }
    </style>
</head>
<body>
    <div id="toast"></div>

    <button id="backToTopBtn" onclick="scrollToTop()" title="กลับขึ้นบนสุด">
        <span class="material-icons-outlined">arrow_upward</span>
    </button>

    <!-- หน้า 1: รวมอัลบั้ม -->
    <div id="home-view" class="container">
        <a href="index.html" style="text-decoration: none; display: inline-block;">
            <div class="nav-bar"><span class="material-icons-outlined" style="font-size:18px;">west</span> กลับหน้าหลัก</div>
        </a>

        <div class="home-hero" id="home-hero-bg">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h2 id="home-hero-text">กำลังซิงค์ข้อมูล...</h2>
                <p style="margin: 8px 0 0 0; font-size: clamp(14px, 2vw, 16px); color: rgba(255,255,255,0.9);">ศูนย์ดิจิทัลชุมชน รร.หนองโกวิชาประสิทธิ์พิทยาคม</p>
            </div>
        </div>
        
        <div class="header-row">
            <div>
                <h1 style="font-size: 24px; margin:0;">อัลบั้มภาพกิจกรรม</h1>
            </div>
            <div class="search-container">
                <span class="material-icons-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="ค้นหาชื่อกิจกรรม..." oninput="filterAlbums(this.value)">
            </div>
        </div>
        
        <div id="album-list">
            <!-- อัลบั้มจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- หน้า 2: ดูอัลบั้ม (แบบ Pixieset) -->
    <div id="album-view" class="container" style="display: none;">
        
        <!-- รูปหน้าปกกว้างเต็มจอ -->
        <div class="pixieset-hero" id="hero-bg">
            <div class="pixieset-overlay"></div>
            <!-- ปุ่มกดกลับแบบลอย -->
            <div class="btn-back-float" onclick="showHome()"><span class="material-icons-outlined" style="font-size:18px;">west</span> Gallery</div>
            
            <div class="pixieset-content">
                <p class="date" id="hero-date">DD/MM/YYYY</p>
                <h1 id="hero-text">ชื่อกิจกรรม</h1>
                <p class="desc" id="album-details-text"></p>
            </div>
        </div>
        
        <!-- แถบเครื่องมือเล็กๆ มุมขวาบนของตารางรูป -->
        <div class="pixieset-toolbar">
            <button class="action-btn" onclick="confirmDownload()"><span class="material-icons-outlined" style="font-size:18px;">download</span> ดาวน์โหลด (.ZIP)</button>
            <button class="action-btn" onclick="confirmShare()"><span class="material-icons-outlined" style="font-size:18px;">ios_share</span> แชร์</button>
        </div>

        <!-- กริดรูปภาพแบบ Masonry -->
        <div id="photo-container" class="masonry-grid">
            <!-- รูปภาพจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- Popup ดาวน์โหลด -->
    <div id="dlModal" class="modal">
        <div class="confirm-popup">
            <span class="material-icons-outlined close-mini" onclick="closeModal('dlModal')">close</span>
            <div style="margin-bottom: 15px; color: var(--text-main);"><span class="material-icons-outlined" style="font-size: 40px;">folder_zip</span></div>
            <h3 style="margin: 0; font-size: 20px;">ยืนยันการดาวน์โหลด</h3>
            <p style="font-size: 14px; margin: 10px 0 20px;">ต้องการดาวน์โหลดรูปภาพทั้งหมดในอัลบั้มนี้เป็นไฟล์ (.ZIP) หรือไม่?</p>
            <div style="display:flex; gap:10px;">
                <button onclick="closeModal('dlModal')" style="flex:1; padding:12px; background: #f1f5f9; color: var(--text-main); border:none; border-radius:50px; cursor:pointer; font-family: 'Kanit';">ยกเลิก</button>
                <button onclick="executeZipDownload()" style="flex:1; padding:12px; background:var(--text-main); color:white; border:none; border-radius:50px; cursor:pointer; font-family: 'Kanit';">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Popup แชร์ -->
    <div id="shModal" class="modal">
        <div class="confirm-popup">
            <span class="material-icons-outlined close-mini" onclick="closeModal('shModal')">close</span>
            <h3 style="margin: 0; font-size: 20px;">แชร์ลิงก์อัลบั้ม</h3>
            <div id="shareUrlDisplay" style="background:#f8fafc; padding:12px; border-radius:10px; font-size:13px; margin:20px 0; word-break:break-all; text-align:left; border:1px solid var(--border-color); color:var(--text-sub); user-select: all;"></div>
            <button onclick="executeCopyLink()" class="btn-minimal" style="width:100%; margin-top: 0;">คัดลอกลิงก์</button>
        </div>
    </div>

    <!-- Lightbox ดูรูปขยาย -->
    <div id="imageModal" class="modal">
        <span class="material-icons-outlined close-mini" onclick="closeLightbox()">close</span>
        <button class="nav-btn btn-prev" onclick="prevImage()"><span class="material-icons-outlined">chevron_left</span></button>
        <button class="nav-btn btn-next" onclick="nextImage()"><span class="material-icons-outlined">chevron_right</span></button>
        <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;" onclick="closeLightbox()">
            <img id="lightboxImg" style="max-width:90%; max-height:85vh; object-fit:contain;" src="" onclick="event.stopPropagation()">
            <div id="imgCounter" style="color:rgba(255,255,255,0.7); margin-top:15px; font-size:14px; letter-spacing: 2px;"></div>
            <button class="btn-minimal" style="background: transparent; border: 1px solid rgba(255,255,255,0.5); padding: 8px 20px; font-size: 13px;" onclick="event.stopPropagation(); triggerDownload()"><span class="material-icons-outlined" style="vertical-align: middle; margin-right: 5px; font-size: 16px;">download</span>ดาวน์โหลด</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚠️ ลิงก์ GAS ของคุณ
        // =========================================================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby0hNUSRLGNWS_Wdh92uIg6L__I2AbqKjw1wHJgDScBZmLzhmHwqP0yuOjLaipNYLej/exec"; 
        
        let currentAlbumImages = [];
        let currentIndex = 0;
        let isDownloading = false;

        async function init() {
            const list = document.getElementById('album-list');
            list.innerHTML = ''; 
            for(let i=0; i<6; i++) { list.innerHTML += `<div class="skeleton" style="height: 250px; border-radius:12px;"></div>`; }
            
            try {
                try {
                    const resHero = await fetch(GAS_API_URL + "?action=getRandomHero");
                    const hero = await resHero.json();
                    if(hero && hero.url) {
                        document.getElementById('home-hero-bg').style.backgroundImage = `url('${hero.url}')`; 
                        document.getElementById('home-hero-text').innerText = hero.activityName || "Gallery & Memories";
                    } else {
                        document.getElementById('home-hero-text').innerText = "Gallery & Memories";
                    }
                } catch(e) { document.getElementById('home-hero-text').innerText = "Gallery & Memories"; }

                const response = await fetch(GAS_API_URL + "?action=getAlbums");
                const albums = await response.json();
                
                list.innerHTML = '';
                if (!albums || albums.length === 0) {
                    list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 50px;">ไม่มีข้อมูลอัลบั้ม</div>';
                    return;
                }

                albums.forEach(album => {
                    const card = document.createElement('div'); 
                    card.className = 'album-card'; 
                    card.setAttribute('data-name', album.name.toLowerCase());
                    card.onclick = () => openAlbum(album);
                    
                    const albumDate = album.date || '';
                    
                    card.innerHTML = `
                        <img src="https://drive.google.com/thumbnail?id=${album.coverId}&sz=w800" alt="${album.name}" loading="lazy">
                        <div style="padding: 20px;">
                            <p style="margin: 0 0 5px 0; font-size: 12px; font-weight: 500;">${albumDate}</p>
                            <h3 style="margin:0; font-size:16px; font-weight:500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${album.name}</h3>
                        </div>`;
                    list.appendChild(card);
                });

                // ตรวจสอบ Parameter เผื่อถูกส่งมาจากหน้า index
                const urlParams = new URLSearchParams(window.location.search);
                const targetAlbumName = urlParams.get('album');

                if (targetAlbumName) {
                    const cleanTarget = targetAlbumName.toLowerCase().trim();
                    const matchedAlbum = albums.find(a => a.name.toLowerCase().trim() === cleanTarget);
                    
                    if (matchedAlbum) {
                        openAlbum(matchedAlbum);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } else {
                         showToast('ไม่พบกิจกรรมที่เลือก');
                    }
                }

            } catch (err) {
                list.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#ef4444; padding:50px;">ไม่สามารถดึงข้อมูลได้</p>';
            }
        }

        async function openAlbum(album) {
            document.getElementById('home-view').style.display = 'none'; 
            document.getElementById('album-view').style.display = 'block';
            window.scrollTo(0,0);
            
            document.getElementById('hero-text').innerText = album.name; 
            document.getElementById('hero-date').innerText = album.date || '';
            document.getElementById('album-details-text').innerText = album.details || '';
            document.getElementById('hero-bg').style.backgroundImage = `url('https://drive.google.com/thumbnail?id=${album.coverId}&sz=w1600')`;
            
            const container = document.getElementById('photo-container');
            container.innerHTML = ''; 
            
            // สร้างโครง Skeletons แบบสุ่มความสูงให้คล้าย Masonry
            for(let i=0; i<12; i++) { 
                let h = Math.floor(Math.random() * 200) + 150; 
                container.innerHTML += `<div class="skeleton masonry-item" style="height: ${h}px;"></div>`; 
            }
            
            try {
                const response = await fetch(GAS_API_URL + "?action=getImages&folderId=" + album.folderId);
                const images = await response.json();
                
                currentAlbumImages = images; 
                container.innerHTML = '';

                if (currentAlbumImages.length === 0) {
                    container.innerHTML = '<div style="column-span: all; text-align: center; color: #94a3b8; padding: 50px;">ไม่มีรูปภาพ</div>';
                    return;
                }

                images.forEach((img, idx) => {
                    const item = document.createElement('div'); 
                    item.className = 'masonry-item';
                    item.onclick = () => openLightbox(idx);
                    item.innerHTML = `
                        <img src="${img.url}" loading="lazy">
                        <div class="img-action-container">
                            <div class="mini-btn" onclick="event.stopPropagation(); startDownload('${img.downloadUrl || img.url}')"><span class="material-icons-outlined" style="font-size:18px;">download</span></div>
                        </div>`;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = '<p style="column-span: all; text-align:center; color:#ef4444; padding:50px;">ไม่สามารถโหลดรูปภาพได้</p>';
            }
        }

        function filterAlbums(q) { 
            document.querySelectorAll('.album-card').forEach(c => {
                c.style.display = c.getAttribute('data-name').includes(q.toLowerCase()) ? 'block' : 'none';
            }); 
        }

        function openLightbox(idx) { 
            currentIndex = idx; 
            updateLightbox(); 
            document.getElementById('imageModal').style.display = 'flex'; 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('imageModal').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
        }
        function updateLightbox() { 
            document.getElementById('lightboxImg').src = currentAlbumImages[currentIndex].url || currentAlbumImages[currentIndex]; 
            document.getElementById('imgCounter').innerText = `${currentIndex + 1} / ${currentAlbumImages.length}`; 
        }
        function nextImage() { currentIndex = (currentIndex + 1) % currentAlbumImages.length; updateLightbox(); }
        function prevImage() { currentIndex = (currentIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length; updateLightbox(); }

        function startDownload(url) { window.open(url, '_blank'); }
        function triggerDownload() { 
            const url = currentAlbumImages[currentIndex].downloadUrl || currentAlbumImages[currentIndex].url || currentAlbumImages[currentIndex];
            startDownload(url); 
        }
        function confirmDownload() { document.getElementById('dlModal').style.display = 'flex'; }
        
        async function executeZipDownload() { 
            if(isDownloading) return;
            closeModal('dlModal'); 
            
            const t = document.getElementById('toast');
            t.innerText = "กำลังเตรียมบีบอัดไฟล์ (ZIP)...";
            t.classList.add("show");
            isDownloading = true;
            
            try {
                const zip = new JSZip();
                let successCount = 0;
                const total = currentAlbumImages.length;

                for(let i = 0; i < total; i++) {
                    t.innerText = `ดึงข้อมูลภาพ (${i+1}/${total})...`;
                    try {
                        let fileId = "";
                        const imgUrl = currentAlbumImages[i].url || currentAlbumImages[i];
                        if (imgUrl.includes('id=')) fileId = imgUrl.split('id=')[1].split('&')[0];

                        if (fileId) {
                            const response = await fetch(GAS_API_URL + "?action=getBase64&fileId=" + fileId);
                            const json = await response.json();
                            if (json.data) {
                                const fileName = currentAlbumImages[i].fileName || `image_${i+1}.jpg`;
                                zip.file(fileName, json.data, {base64: true});
                                successCount++;
                            }
                        }
                    } catch (e) { console.error(e); }
                }

                if(successCount === 0) throw new Error("ไม่สามารถดึงรูปภาพได้");

                t.innerText = "กำลังบันทึกไฟล์...";
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, document.getElementById('hero-text').innerText + ".zip");
                
                t.innerText = "ดาวน์โหลดสำเร็จ!";
                setTimeout(() => t.classList.remove("show"), 3000);

            } catch (error) {
                t.innerText = "เกิดข้อผิดพลาด กรุณาดาวน์โหลดทีละรูปครับ";
                setTimeout(() => t.classList.remove("show"), 3000);
            } finally { isDownloading = false; }
        }
        
        function confirmShare() { 
            document.getElementById('shareUrlDisplay').innerText = window.location.href; 
            document.getElementById('shModal').style.display = 'flex'; 
        }
        function executeCopyLink() { 
            navigator.clipboard.writeText(window.location.href).then(() => {
                closeModal('shModal'); 
                showToast("คัดลอกลิงก์สำเร็จ นำไปส่งต่อได้เลย!");
            });
        }

        function showHome() { document.getElementById('home-view').style.display = 'block'; document.getElementById('album-view').style.display = 'none'; window.scrollTo(0,0); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3000); }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById("backToTopBtn");
            if (window.scrollY > 300) btn.classList.add("show");
            else btn.classList.remove("show");
        });

        window.addEventListener('keydown', e => { 
            if(document.getElementById('imageModal').style.display === 'flex') { 
                if(e.key === 'ArrowRight') nextImage(); 
                if(e.key === 'ArrowLeft') prevImage(); 
                if(e.key === 'Escape') closeLightbox(); 
            } 
        });

        window.onload = init;
    </script>
</body>
</html>
