<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <meta property="og:title" content="ระบบคลังรูปภาพกิจกรรม รร.หนองโกวิชาประสิทธิ์พิทยาคม">
    <meta property="og:description" content="ประมวลภาพกิจกรรมและผลงานต่างๆ ของโรงเรียน">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1XvvNNsIH3ir3ITQLc5oEqMA9xYptQMwV">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1XvvNNsIH3ir3ITQLc5oEqMA9xYptQMwV" type="image/x-icon">

    <title>คลังรูปภาพกิจกรรม - ศูนย์ดิจิทัลชุมชน</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { 
            --accent: #059669; 
            --accent-hover: #047857; 
            --accent-light: #ecfdf5; 
            --bg: #ffffff; 
            --bg-card: #ffffff; 
            --text-main: #1e293b; 
            --text-sub: #64748b; 
            --border-color: #f1f5f9; 
            --icon-dark: #94a3b8; 
        }

        /* เปิดใช้งาน Smooth Scrolling ทั้งเอกสาร */
        html { scroll-behavior: smooth; }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            overflow-x: hidden; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        h1, h2, h3, h4, h5, h6 { font-family: 'Kanit', sans-serif; text-decoration: none !important; color: var(--text-main); }
        p { text-decoration: none !important; color: var(--text-sub); }

        .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 20px 4vw; box-sizing: border-box; }
        @media (max-width: 768px) { .container { padding: 15px 4vw; } }

        /* แอนิเมชันตอนสลับหน้า (Fade In + Slide Up เบาๆ) */
        .page-transition {
            animation: pageFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =======================================================
           1. หน้าแรกรวมอัลบั้ม (Home View)
           ======================================================= */
        .home-hero { 
            position: relative; height: 35vh; min-height: 250px; max-height: 400px; 
            border-radius: 12px; margin-bottom: 40px; background-size: cover; 
            background-position: center; display: flex; align-items: flex-end; 
            overflow: hidden; 
        }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent); z-index: 1; }
        .hero-content { position: relative; z-index: 2; padding: 40px 4vw; color: white; width: 100%; box-sizing: border-box; }
        .hero-content h2 { margin: 0; font-size: clamp(26px, 4vw, 42px); font-weight: 500; color: white;}

        #album-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        @media (max-width: 640px) { #album-list { grid-template-columns: 1fr; } } 
        
        .album-card { background: var(--bg-card); overflow: hidden; cursor: pointer; transition: all 0.3s ease; }
        .album-card:hover { opacity: 0.9; }
        .album-card img { width: 100%; height: 220px; object-fit: cover; transition: 0.5s; border-radius: 4px; }

        .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .search-container { position: relative; max-width: 400px; width: 100%; }
        .search-input { width: 100%; padding: 10px 20px 10px 40px; border-radius: 4px; border: 1px solid #e2e8f0; outline: none; font-family: 'Prompt', sans-serif; font-size: 14px; box-sizing: border-box; color: var(--text-main); transition: 0.3s; background: #f8fafc;}
        .search-input:focus { border-color: var(--icon-dark); background: white; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px !important;}
        
        /* 🔥 ปุ่มนำทางหน้าหลัก (ปรับให้สมูทและเห็นชัด) */
        .nav-bar { 
            display: inline-flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 25px; 
            font-weight: 500; color: var(--text-main); font-size: 14px; 
            padding: 8px 20px; background: white; border: 1px solid var(--border-color); 
            border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .nav-bar:hover { 
            transform: translateX(-5px); /* เลื่อนถอยหลังนิดๆ ดึงดูดสายตา */
            color: var(--accent); 
            border-color: var(--accent-light);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        /* =======================================================
           2. หน้าข้างในอัลบั้ม (สไตล์ PIXIESET)
           ======================================================= */
        
        /* หน้าปกใหญ่เต็มจอ กว้างสุดขอบ */
        .pixieset-hero {
            position: relative;
            width: 100vw;
            height: 75vh;
            min-height: 400px;
            margin-left: calc(-50vw + 50%);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            margin-top: -20px;
            margin-bottom: 0;
        }
        
        .pixieset-overlay-bottom {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 30%);
            z-index: 1;
        }

        .hero-bottom-container {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 30px 4vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            box-sizing: border-box;
            flex-wrap: wrap;
            gap: 20px;
        }

        .pixieset-content { text-align: left; }
        
        .pixieset-content h1 {
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 300; 
            margin: 0;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            font-family: 'Prompt', sans-serif;
        }

        .btn-view-gallery {
            display: inline-block; 
            padding: 10px 24px; 
            border: 1px solid rgba(255,255,255,0.7); 
            color: white; 
            font-size: 11px; 
            font-weight: 400; 
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.4s; 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(4px); 
            cursor: pointer; 
            white-space: nowrap; 
        }
        .btn-view-gallery:hover { background: white; color: black; border-color: white;}

        /* 🔥 ปุ่มย้อนกลับแบบลอยบนรูป (แก้ใหม่ให้ชัดมากกขึ้น) */
        .btn-back-float {
            position: absolute;
            top: 30px;
            left: 4vw;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.45); /* สีดำโปร่งแสง */
            backdrop-filter: blur(8px); /* เบลอฉากหลังนิดๆ */
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .btn-back-float:hover { 
            background: rgba(0, 0, 0, 0.75); 
            transform: translateX(-5px); /* เลื่อนซ้ายนิดนึง */
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* แถบสีขาวแสดงข้อมูล & แถบเครื่องมือ */
        .info-toolbar-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0 40px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .album-meta-info { max-width: 600px; }
        .album-meta-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-main);
            font-family: 'Prompt', sans-serif;
        }
        .album-meta-info p {
            margin: 0;
            font-size: 11px;
            color: var(--icon-dark);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        .pixieset-toolbar { display: flex; gap: 25px; align-items: center; }
        .pixieset-toolbar .action-btn {
            display: flex; align-items: center; gap: 6px;
            background: transparent; border: none;
            color: var(--icon-dark); font-size: 12px; font-weight: 300;
            cursor: pointer; transition: 0.3s; padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        .pixieset-toolbar .action-btn:hover { color: var(--text-main); }

        /* รูปแบบ Masonry Grid */
        .masonry-grid {
            column-count: 3; 
            column-gap: 8px; 
            padding-bottom: 60px;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 8px; 
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: #f8fafc;
        }
        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: filter 0.3s ease;
        }
        .masonry-item:hover img { filter: brightness(0.85); }
        
        .img-action-container { position: absolute; bottom: 12px; right: 12px; display: flex; gap: 8px; opacity: 0; transition: 0.3s; }
        .masonry-item:hover .img-action-container { opacity: 1; }
        .mini-btn { background: rgba(255,255,255,0.9); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .mini-btn:hover { background: white; color: black; transform: scale(1.1); }

        @media (max-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 768px) {
            .masonry-grid { column-count: 2; column-gap: 4px; } 
            .masonry-item { margin-bottom: 4px; }
            .pixieset-hero { height: 50vh; min-height: 300px; }
            .btn-back-float { top: 15px; left: 15px; font-size: 12px; padding: 8px 16px; }
            .hero-bottom-container { padding: 20px 4vw; flex-direction: column; align-items: flex-start; gap: 15px;}
            .info-toolbar-section { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px 0; }
            .pixieset-toolbar { flex-wrap: wrap; gap: 15px; }
        }
        @media (max-width: 480px) { .masonry-grid { column-count: 2; } }

        /* =======================================================
           3. Modal / Lightbox / Skeletons
           ======================================================= */
        .modal { display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .confirm-popup { background: white; padding: 40px 30px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .close-mini { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #94a3b8; font-size: 28px !important; transition: 0.3s; z-index: 10600; }
        .close-mini:hover { color: #000; }
        
        #imageModal { background: rgba(20, 20, 20, 0.98); } 
        #imageModal .close-mini { color: white; top: 25px; right: 25px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 10px; cursor: pointer; z-index: 10010; color: white; transition: 0.3s; opacity: 0.5; }
        .nav-btn:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .nav-btn span { font-size: 40px; }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }

        .btn-minimal { margin-top: 20px; background: var(--text-main); color: white; padding: 12px 30px; border-radius: 4px; border: none; cursor: pointer; font-family: 'Kanit'; font-weight: 300; font-size: 14px; transition: 0.3s; }
        .btn-minimal:hover { background: black; }

        #toast { visibility: hidden; min-width: 250px; background: rgba(0,0,0,0.8); color: #fff; text-align: center; border-radius: 4px; padding: 12px 24px; position: fixed; z-index: 10000; left: 50%; bottom: 40px; transform: translateX(-50%); opacity: 0; transition: 0.4s; font-size: 13px; font-weight: 300;}
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }

        #backToTopBtn {
            position: fixed; bottom: 30px; right: 30px; z-index: 9900; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transform: translateY(20px);
        }
        #backToTopBtn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #backToTopBtn:hover { background: rgba(0,0,0,0.8); }

        .skeleton { background: #e2e8f0; background: linear-gradient(110deg, #e2e8f0 8%, #f8fafc 18%, #e2e8f0 33%); background-size: 200% 100%; animation: 1.5s shine linear infinite; border-radius: 2px; width: 100%; }
        @keyframes shine { to { background-position-x: -200%; } }
    </style>
</head>
<body>
    <div id="toast"></div>

    <button id="backToTopBtn" onclick="scrollToTop()" title="กลับขึ้นบนสุด">
        <span class="material-icons-outlined">arrow_upward</span>
    </button>

    <!-- หน้า 1: รวมอัลบั้ม -->
    <div id="home-view" class="container page-transition">
        <a href="index.html" style="text-decoration: none; display: inline-block;">
            <div class="nav-bar"><span class="material-icons-outlined" style="font-size:18px;">west</span> กลับหน้าหลัก</div>
        </a>
        
        <div class="header-row">
            <div>
                <h1 style="font-size: 28px; font-weight: 400; margin:0;">อัลบั้มภาพกิจกรรม</h1>
            </div>
            <div class="search-container">
                <span class="material-icons-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="ค้นหาชื่อกิจกรรม..." oninput="filterAlbums(this.value)">
            </div>
        </div>
        
        <div id="album-list">
            <!-- อัลบั้มจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- หน้า 2: ดูอัลบั้ม (แบบ Pixieset) -->
    <div id="album-view" class="container page-transition" style="display: none; padding-top: 0;">
        
        <!-- รูปหน้าปกกว้างเต็มจอ -->
        <div class="pixieset-hero" id="hero-bg">
            <div class="pixieset-overlay-bottom"></div>
            
            <!-- 🔥 ปุ่มกดกลับแบบลอย (ดีไซน์ใหม่ ชัดเจน) -->
            <div class="btn-back-float" onclick="showHome()">
                <span class="material-icons-outlined" style="font-size:18px;">west</span>
                ย้อนกลับ
            </div>
            
            <div class="hero-bottom-container">
                <!-- ฝั่งซ้าย: ชื่อกิจกรรมตัวใหญ่ -->
                <div class="pixieset-content">
                    <h1 id="hero-text">ชื่อกิจกรรม</h1>
                </div>
                <!-- ฝั่งขวา: ปุ่ม VIEW GALLERY -->
                <div class="btn-view-gallery" onclick="document.getElementById('photo-container').scrollIntoView({behavior: 'smooth'})">VIEW GALLERY</div>
            </div>
        </div>
        
        <!-- แถบด้านล่าง: ข้อมูลอัลบั้ม (ซ้าย) + เครื่องมือ (ขวา) -->
        <div class="info-toolbar-section">
            <div class="album-meta-info">
                <h3 id="meta-title">ชื่อกิจกรรม</h3>
                <p id="meta-subtitle">กำลังโหลด...</p>
            </div>
            
            <div class="pixieset-toolbar">
                <button class="action-btn" onclick="document.getElementById('photo-container').scrollIntoView({behavior: 'smooth'})"><span class="material-icons-outlined" style="font-size:16px;">grid_view</span> Gallery</button>
                <button class="action-btn" onclick="confirmDownload()"><span class="material-icons-outlined" style="font-size:16px;">download</span> Download</button>
                <button class="action-btn" onclick="confirmShare()"><span class="material-icons-outlined" style="font-size:16px;">share</span> Share</button>
            </div>
        </div>

        <!-- กริดรูปภาพแบบ Masonry (3 คอลัมน์) -->
        <div id="photo-container" class="masonry-grid">
            <!-- รูปภาพจะถูกสร้างที่นี่ -->
        </div>
    </div>

    <!-- Popup ดาวน์โหลด -->
    <div id="dlModal" class="modal">
        <div class="confirm-popup">
            <span class="material-icons-outlined close-mini" onclick="closeModal('dlModal')">close</span>
            <div style="margin-bottom: 15px; color: var(--text-main);"><span class="material-icons-outlined" style="font-size: 36px;">folder_zip</span></div>
            <h3 style="margin: 0; font-size: 20px; font-weight:400;">ดาวน์โหลดอัลบั้ม</h3>
            <p style="font-size: 13px; margin: 10px 0 25px; color: var(--icon-dark);">ระบบจะทำการบีบอัดรูปภาพทั้งหมดเป็นไฟล์ .ZIP เพื่อให้คุณดาวน์โหลดในครั้งเดียว</p>
            <div style="display:flex; gap:10px;">
                <button onclick="closeModal('dlModal')" style="flex:1; padding:10px; background: #f1f5f9; color: var(--text-main); border:none; border-radius:4px; cursor:pointer; font-family: 'Kanit';">ยกเลิก</button>
                <button onclick="executeZipDownload()" style="flex:1; padding:10px; background:var(--text-main); color:white; border:none; border-radius:4px; cursor:pointer; font-family: 'Kanit';">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Popup แชร์ -->
    <div id="shModal" class="modal">
        <div class="confirm-popup">
            <span class="material-icons-outlined close-mini" onclick="closeModal('shModal')">close</span>
            <h3 style="margin: 0; font-size: 20px; font-weight:400;">แชร์ลิงก์อัลบั้ม</h3>
            <div id="shareUrlDisplay" style="background:#f8fafc; padding:12px; border-radius:4px; font-size:12px; margin:20px 0; word-break:break-all; text-align:left; border:1px solid var(--border-color); color:var(--text-sub); user-select: all;"></div>
            <button onclick="executeCopyLink()" class="btn-minimal" style="width:100%; margin-top: 0;">คัดลอกลิงก์</button>
        </div>
    </div>

    <!-- Lightbox ดูรูปขยาย -->
    <div id="imageModal" class="modal">
        <span class="material-icons-outlined close-mini" onclick="closeLightbox()">close</span>
        <button class="nav-btn btn-prev" onclick="prevImage()"><span class="material-icons-outlined">chevron_left</span></button>
        <button class="nav-btn btn-next" onclick="nextImage()"><span class="material-icons-outlined">chevron_right</span></button>
        <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;" onclick="closeLightbox()">
            <img id="lightboxImg" style="max-width:90%; max-height:85vh; object-fit:contain;" src="" onclick="event.stopPropagation()">
            <div id="imgCounter" style="color:rgba(255,255,255,0.7); margin-top:15px; font-size:12px; letter-spacing: 2px;"></div>
            <button class="btn-minimal" style="background: transparent; border: 1px solid rgba(255,255,255,0.5); padding: 8px 20px; font-size: 12px; border-radius: 50px;" onclick="event.stopPropagation(); triggerDownload()"><span class="material-icons-outlined" style="vertical-align: middle; margin-right: 5px; font-size: 16px;">download</span> ดาวน์โหลด</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚠️ ลิงก์ GAS ของคุณ
        // =========================================================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxFZa0lqQBLFqaUkyAgi9K1OTzeokQjJtNP2zmTsuO_UrmVL8GCEggqKMC5g6Mczjsm/exec";
        
        let currentAlbumImages = [];
        let currentIndex = 0;
        let isDownloading = false;

        async function init() {
            const list = document.getElementById('album-list');
            list.innerHTML = ''; 
            for(let i=0; i<6; i++) { list.innerHTML += `<div class="skeleton" style="height: 250px; border-radius:4px;"></div>`; }
            
            try {
                const response = await fetch(GAS_API_URL + "?action=getAlbums");
                const albums = await response.json();
                
                list.innerHTML = '';
                if (!albums || albums.length === 0) {
                    list.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 50px;">ไม่มีข้อมูลอัลบั้ม</div>';
                    return;
                }

                albums.forEach(album => {
                    const card = document.createElement('div'); 
                    card.className = 'album-card'; 
                    card.setAttribute('data-name', album.name.toLowerCase());
                    card.onclick = () => openAlbum(album);
                    
                    const albumDate = album.date || '';
                    
                    card.innerHTML = `
                        <img src="https://drive.google.com/thumbnail?id=${album.coverId}&sz=w800" alt="${album.name}" loading="lazy">
                        <div style="padding: 15px 5px;">
                            <p style="margin: 0 0 4px 0; font-size: 11px; font-weight: 400; color: #94a3b8;">${albumDate}</p>
                            <h3 style="margin:0; font-size:15px; font-weight:400; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${album.name}</h3>
                        </div>`;
                    list.appendChild(card);
                });

                // ตรวจสอบ Parameter
                const urlParams = new URLSearchParams(window.location.search);
                const targetAlbumName = urlParams.get('album');

                if (targetAlbumName) {
                    const cleanTarget = targetAlbumName.toLowerCase().trim();
                    const matchedAlbum = albums.find(a => a.name.toLowerCase().trim() === cleanTarget);
                    
                    if (matchedAlbum) {
                        openAlbum(matchedAlbum);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } else {
                         showToast('ไม่พบกิจกรรมที่เลือก');
                    }
                }

            } catch (err) {
                list.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#ef4444; padding:50px;">ไม่สามารถดึงข้อมูลได้</p>';
            }
        }

        async function openAlbum(album) {
            const homeView = document.getElementById('home-view');
            const albumView = document.getElementById('album-view');
            
            homeView.style.display = 'none'; 
            
            // รีเฟรชแอนิเมชันให้ไหลขึ้นมาแบบสมูท
            albumView.style.display = 'block';
            albumView.style.animation = 'none';
            void albumView.offsetWidth; 
            albumView.style.animation = null;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // กำหนดข้อมูลลงในหน้าปก
            document.getElementById('hero-text').innerText = album.name; 
            document.getElementById('meta-title').innerText = album.name; 
            
            let subtitleText = "";
            if(album.date) subtitleText += `DATE : ${album.date}  |  `;
            if(album.details) subtitleText += album.details;
            document.getElementById('meta-subtitle').innerText = subtitleText || 'ศูนย์ดิจิทัลชุมชน รร.หนองโกวิชาประสิทธิ์พิทยาคม';
            
            document.getElementById('hero-bg').style.backgroundImage = `url('https://drive.google.com/thumbnail?id=${album.coverId}&sz=w1600')`;
            
            const container = document.getElementById('photo-container');
            container.innerHTML = ''; 
            
            for(let i=0; i<9; i++) { 
                let h = Math.floor(Math.random() * 150) + 150; 
                container.innerHTML += `<div class="skeleton masonry-item" style="height: ${h}px;"></div>`; 
            }
            
            try {
                const response = await fetch(GAS_API_URL + "?action=getImages&folderId=" + album.folderId);
                const images = await response.json();
                
                currentAlbumImages = images; 
                container.innerHTML = '';

                if (currentAlbumImages.length === 0) {
                    container.innerHTML = '<div style="column-span: all; text-align: center; color: #94a3b8; padding: 50px;">ไม่มีรูปภาพ</div>';
                    return;
                }

                images.forEach((img, idx) => {
                    const item = document.createElement('div'); 
                    item.className = 'masonry-item';
                    item.onclick = () => openLightbox(idx);
                    item.innerHTML = `
                        <img src="${img.url}" loading="lazy">
                        <div class="img-action-container">
                            <div class="mini-btn" onclick="event.stopPropagation(); startDownload('${img.downloadUrl || img.url}')"><span class="material-icons-outlined" style="font-size:16px;">download</span></div>
                        </div>`;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = '<p style="column-span: all; text-align:center; color:#ef4444; padding:50px;">ไม่สามารถโหลดรูปภาพได้</p>';
            }
        }

        // 🔥 ฟังก์ชันโฮมที่แก้ให้สมูทขึ้น
        function showHome() { 
            const homeView = document.getElementById('home-view');
            const albumView = document.getElementById('album-view');

            albumView.style.display = 'none'; 
            homeView.style.display = 'block'; 
            
            homeView.style.animation = 'none';
            void homeView.offsetWidth; 
            homeView.style.animation = null;

            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        function filterAlbums(q) { 
            document.querySelectorAll('.album-card').forEach(c => {
                c.style.display = c.getAttribute('data-name').includes(q.toLowerCase()) ? 'block' : 'none';
            }); 
        }

        function openLightbox(idx) { 
            currentIndex = idx; 
            updateLightbox(); 
            document.getElementById('imageModal').style.display = 'flex'; 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('imageModal').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
        }
        function updateLightbox() { 
            document.getElementById('lightboxImg').src = currentAlbumImages[currentIndex].url || currentAlbumImages[currentIndex]; 
            document.getElementById('imgCounter').innerText = `${currentIndex + 1} / ${currentAlbumImages.length}`; 
        }
        function nextImage() { currentIndex = (currentIndex + 1) % currentAlbumImages.length; updateLightbox(); }
        function prevImage() { currentIndex = (currentIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length; updateLightbox(); }

        function startDownload(url) { window.open(url, '_blank'); }
        function triggerDownload() { 
            const url = currentAlbumImages[currentIndex].downloadUrl || currentAlbumImages[currentIndex].url || currentAlbumImages[currentIndex];
            startDownload(url); 
        }
        function confirmDownload() { document.getElementById('dlModal').style.display = 'flex'; }
        
        async function executeZipDownload() { 
            if(isDownloading) return;
            closeModal('dlModal'); 
            
            const t = document.getElementById('toast');
            t.innerText = "กำลังเตรียมบีบอัดไฟล์ (ZIP)...";
            t.classList.add("show");
            isDownloading = true;
            
            try {
                const zip = new JSZip();
                let successCount = 0;
                const total = currentAlbumImages.length;

                for(let i = 0; i < total; i++) {
                    t.innerText = `ดึงข้อมูลภาพ (${i+1}/${total})...`;
                    try {
                        let fileId = "";
                        const imgUrl = currentAlbumImages[i].url || currentAlbumImages[i];
                        if (imgUrl.includes('id=')) fileId = imgUrl.split('id=')[1].split('&')[0];

                        if (fileId) {
                            const response = await fetch(GAS_API_URL + "?action=getBase64&fileId=" + fileId);
                            const json = await response.json();
                            if (json.data) {
                                const fileName = currentAlbumImages[i].fileName || `image_${i+1}.jpg`;
                                zip.file(fileName, json.data, {base64: true});
                                successCount++;
                            }
                        }
                    } catch (e) { console.error(e); }
                }

                if(successCount === 0) throw new Error("ไม่สามารถดึงรูปภาพได้");

                t.innerText = "กำลังบันทึกไฟล์...";
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, document.getElementById('hero-text').innerText + ".zip");
                
                t.innerText = "ดาวน์โหลดสำเร็จ!";
                setTimeout(() => t.classList.remove("show"), 3000);

            } catch (error) {
                t.innerText = "เกิดข้อผิดพลาด กรุณาดาวน์โหลดทีละรูปครับ";
                setTimeout(() => t.classList.remove("show"), 3000);
            } finally { isDownloading = false; }
        }
        
        function confirmShare() { 
            document.getElementById('shareUrlDisplay').innerText = window.location.href; 
            document.getElementById('shModal').style.display = 'flex'; 
        }
        function executeCopyLink() { 
            navigator.clipboard.writeText(window.location.href).then(() => {
                closeModal('shModal'); 
                showToast("คัดลอกลิงก์สำเร็จ นำไปส่งต่อได้เลย!");
            });
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3000); }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById("backToTopBtn");
            if (window.scrollY > 300) btn.classList.add("show");
            else btn.classList.remove("show");
        });

        window.addEventListener('keydown', e => { 
            if(document.getElementById('imageModal').style.display === 'flex') { 
                if(e.key === 'ArrowRight') nextImage(); 
                if(e.key === 'ArrowLeft') prevImage(); 
                if(e.key === 'Escape') closeLightbox(); 
            } 
        });

        window.onload = init;
    </script>
</body>
</html>
